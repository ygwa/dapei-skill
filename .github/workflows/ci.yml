name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Shell Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          find scripts -type f -name "*.sh" | sort | while read -r f; do
            echo "Checking $f..."
            bash -n "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done
          echo "All shell scripts passed syntax check"

  version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert every version source agrees
        run: bash scripts/check-version-consistency.sh

  dapei-commands:
    name: Dapei CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine bundle
        run: npm run build

      - name: Run smoke test (source mode)
        run: bash scripts/smoke-test.sh

      - name: Run smoke test (shipped bundle)
        env:
          DAPEI_USE_BUNDLE: '1'
        run: bash scripts/smoke-test.sh

  test-layers:
    name: 4-Layer Test Suite (L1+L2 / L3 / scenarios / L4 AI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc, no emit)
        run: npm run typecheck

      - name: Skill contracts (validate:skills)
        run: npm run validate:skills

      - name: Build engine bundle (esbuild)
        run: npm run build

      - name: Shipped engine bundle smoke (dist/dapei-engine.js)
        run: npm run smoke:bundle

      - name: Unit tests (tests/unit)
        run: npm run test:unit

      - name: Integration tests (tests/integration)
        run: npm run test:integration

      - name: End-to-end scenarios (tests/scenarios)
        run: npm run test:scenarios

      - name: Router tests (tests/router)
        run: npm run test:router

      - name: L4 AI behavior compliance (mock harness)
        run: npm run test:ai-behavior

  guardrail:
    name: Dapei Guardrail Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guardrail over every feature in this repo
        run: ./scripts/dapei-guardrail --all

  schema-validate:
    name: YAML Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check embedded template assets are fresh
        run: npm run check:assets

      - name: Validate shipped templates and workspace YAML
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const yaml = require('js-yaml');
            const Ajv = require('ajv/dist/2020');
            const addFormats = require('ajv-formats');
            const list = (dir, re) => fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => re.test(f)).map(f => path.join(dir, f)) : [];
            let checked = 0;
            for (const root of ['runtime/templates/dapei', '.dapei']) {
              if (!fs.existsSync(root)) { console.log('  ' + root + ': absent, skipped'); continue; }
              const commands = path.join(root, 'commands.yaml');
              if (fs.existsSync(commands)) {
                const doc = yaml.load(fs.readFileSync(commands, 'utf8'));
                if (!doc.version) throw new Error(commands + ': missing version');
                if (!Array.isArray(doc.commands)) throw new Error(commands + ': commands must be an array');
                for (const cmd of doc.commands) {
                  for (const field of ['name', 'cli', 'purpose']) {
                    if (!cmd[field]) throw new Error(commands + ': ' + (cmd.name || '?') + ' missing ' + field);
                  }
                  if (!Array.isArray(cmd.workflow)) throw new Error(commands + ': ' + cmd.name + ' workflow must be an array');
                }
                checked++;
              }
              const schemas = [...list(root, /\.schema\.yaml$/), ...list(path.join(root, 'schemas'), /\.ya?ml$/)];
              if (schemas.length > 0) {
                const ajv = new Ajv({ allErrors: true });
                addFormats(ajv);
                for (const file of schemas) { ajv.compile(yaml.load(fs.readFileSync(file, 'utf8'))); checked++; }
              }
              for (const sub of ['rules', 'workflows']) {
                for (const file of list(path.join(root, sub), /\.ya?ml$/)) {
                  if (!yaml.load(fs.readFileSync(file, 'utf8'))) throw new Error(file + ': empty or invalid YAML');
                  checked++;
                }
              }
            }
            console.log('  OK - ' + checked + ' template/workspace YAML files valid');
          "
